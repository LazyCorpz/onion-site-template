name: probe error pages

on:
  push:
    branches: [scratch-error-page]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the nginx image
        run: docker build -t nginx-probe --target openresty-gixy src/nginx
      - name: Start each variant with a live and a dead upstream
        run: |
          set -eu
          mkdir -p /tmp/www && echo 'upstream ok' > /tmp/www/index.html
          (cd /tmp/www && nohup python3 -m http.server 3000 --bind 0.0.0.0 > /tmp/www.log 2>&1 &)
          gw=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          port=8081
          targets=''
          for v in before uri uri494 lua luauri; do
            for up in live dead; do
              d="/tmp/run/$v-$up"
              mkdir -p "$d/conf.d"
              cp src/nginx/conf/nginx.conf "$d/nginx.conf"
              cp -r src/nginx/html "$d/html"
              cp ".github/probe/variants/$v/default.conf" "$d/conf.d/default.conf"
              if [ "$up" = live ]; then addr="http://${gw}:3000"; else addr='http://127.0.0.1:9'; fi
              docker run -d --name "$v-$up" -p "$port:80" \
                -e PROXY_ADDRESS="$addr" -e USE_ONION_LOCATION=0 \
                -v "$d/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf" \
                -v "$d/conf.d:/etc/nginx/conf.d" \
                -v "$d/html:/usr/local/openresty/nginx/html:ro" \
                nginx-probe > /dev/null
              targets="$targets $v/$up=$port"
              port=$((port + 1))
            done
          done
          echo "TARGETS=$targets" >> "$GITHUB_ENV"
          sleep 5
          for t in $targets; do
            p=${t#*=}
            for i in $(seq 1 30); do curl -s -o /dev/null "http://127.0.0.1:${p}/" && break; sleep 1; done
          done
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::${c}"
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' "$c"
            docker logs "$c" 2>&1 | grep -E 'Total issues|No issues|High:|Medium:|Low:|\[emerg\]|\[error\]|\[alert\]' | head -12
            echo "::endgroup::"
          done
      - name: Sweep
        run: python3 .github/probe/sweep.py "$GITHUB_STEP_SUMMARY" $TARGETS
      - name: Raw replies for the interesting cases
        run: |
          for t in $TARGETS; do
            p=${t#*=}
            echo "===== $t"
            printf 'get / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | nc -q 3 127.0.0.1 "$p" | head -3
            curl -s -i "http://127.0.0.1:${p}/error.html" | grep -E '^HTTP/|<h1>|<title>|upstream ok|Error response' | head -3
            curl -s -i -X TRACE "http://127.0.0.1:${p}/" | grep -E '^HTTP/|<h1>|openresty' | head -3
          done
      - name: nginx logs
        if: always()
        run: for c in $(docker ps -a --format '{{.Names}}'); do echo "== $c"; docker logs "$c" 2>&1 | grep -v '^\s*$' | tail -8; done
