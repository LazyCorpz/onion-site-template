# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

# A fork's push runs in the fork, so its results are reported there rather
# than on the pull request. Running on a merge commit reports them here.
on:
  push:
    branches: [main, scratch-template-hardening]
  pull_request:
    branches: [main]

env:
  DOCKER_VERSION: v29.8.1
  DOCKER_COMPOSE_VERSION: v5.5.1

jobs:
  # Builds Docker compose services
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ env.DOCKER_VERSION }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: ${{ env.DOCKER_COMPOSE_VERSION }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './src/**/package-lock.json'
      - name: Build Compose stack
        run: npm run build
  # Checks for dependency conflicts that `npm ci` would miss
  npm:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
        workspace: ['.', './src/express', './src/license-report', './src/mongo']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.workspace }}/package-lock.json'
      - name: Check dependency tree
        run: cd '${{ matrix.workspace }}' && npm i --package-lock-only --dry-run
  # Runs a markdown linting check
  markdownlint:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint-cli2.jsonc
  # Runs a script linting check
  eslint:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install node modules
        run: npm ci --no-fund
      - name: Run eslint
        run: npm run eslint
  # Runs a TypeScript type check
  tsc:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install node modules
        run: npm ci --no-fund
      - name: Run tsc
        run: npm run tsc
  # Checks that npm workspaces are synchronized with the top-level lockfile
  workspaces:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './src/workspaces/package-lock.json'
      - name: Install node modules
        run: npm ci -w ./src/workspaces --no-fund
      - name: Check workspace lockfile synchronization
        run: npm -w ./src/workspaces start
  # Runs unit and integration tests with coverage
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install node modules
        run: npm ci --no-fund
      - name: Run tests
        run: npm run test:coverage
  # Verifies the compose stack serves its onion address
  smoke:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ env.DOCKER_VERSION }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: ${{ env.DOCKER_COMPOSE_VERSION }}
      - name: Serve the onion
        run: npm run test:smoke:start
      - name: Collect logs
        if: failure()
        run: >-
          docker compose --profile production -f docker-compose.yml
          -f .github/smoke/testnet.yml logs
