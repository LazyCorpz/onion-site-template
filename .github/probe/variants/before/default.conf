server {
    server_name localhost;

    # HTTP
    listen 80;

    #charset koi8-r;

    # Since we have inbound tor traffic, we should have rate limits in place
    # to not have to care about IP blocking. As well, client info is useless.
    access_log off;

    set $onion_location ''; # Gixy doesn't parse lua code
    set_by_lua_block $onion_location {
        -- Validating whether use of this header is permitted
        if ngx.shared.onion_domain == '' then
            return ''
        end

        -- Validating request domain is not an onion address
        if string.match(ngx.var.host, '%.onion$') ~= nil then
            return ''
        end

        return string.format('%s%s', ngx.shared.onion_domain, ngx.var.request_uri)
    }

    set_by_lua $proxy_address 'return os.getenv("PROXY_ADDRESS")';

    location / {
        # Only allowing these HTTP methods
        limit_except GET POST HEAD {
            deny all;
        }

        # If variable is present and response is 2XX, adding header
        more_set_headers -s '200 201 202 203 204 205 206 207 208 226' "Onion-Location: $onion_location";

        # Proxying requests to Express
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_pass $proxy_address;
    }

    # Redirecting 4XX/5XX server errors to the static error page
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 @error;
    location @error {
        internal;
        root /usr/local/openresty/nginx/html;
        try_files /error.html =500; # Returns 500 Internal Server Error if error page is missing
        open_file_cache max=1000 inactive=20s;
        sub_filter '<!--@ERROR_CODE-->' $status;
        sub_filter '<!--@ERROR_MESSAGE-->' $status_text;
        sub_filter_once off; # Perform multiple substitutions
    }
}
